#==================================================
#   L O G G I N G
# Logging file (for errors, info ...)
# Defined in a separate property file according to java.util.logging.LogManager
# Must be accessible by class loder (may be put in src/main/java folder)
logManager.properties.file=test7_loggingProperties.properties

#-----------------------------------------------------------------------
# Optional properties : 
#   replace SimpleFormatter by JSON formatter or PlainLogFormatter

#logging.formatter=org.fl.util.JsonLogFormatter
logging.formatter=org.fl.util.PlainLogFormatter

#==================================================

runningContext.operatingInfo.log=false

runningContext.applicationInfo.log=true
runningContext.applicationInfo.logLevel=INFO

